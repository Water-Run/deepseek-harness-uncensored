# The recorded request pins the upstream persona.
- id: uncensored-armor
  disabled: true

- id: system-prompt
  config:
    includeHarnessIdentity: true
    personaPrefix: You are a coding agent powered by the {{model}} model.

- id: llm-replay
  config:
    providers:
      - id: snapshot-command-images
        name: DeepSeek
        models:
          - id: deepseek-flash
            inputModalities: [text, image]

- insert:
    - id: command-attachment-request-capture
      name: '../manual-compact/capture-requests.mjs'
      config:
        path: !!js dshHomePath('command-attachment-requests.jsonl')

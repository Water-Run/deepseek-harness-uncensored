# The replayed conversation runs on a DeepSeek model route, where an unconfigured search selects
# legacy Messages search. This scenario exercises the DeepSeek Search API.
- id: web
  config:
    searchProvider: deepseek-search-api
    fetchProvider: http

- insert:
    - id: replay-acl-skill
      name: '../../../packages/test-support/session-snapshot/tests/fixtures/replay-acl-skill.mjs'
      disabled: !!js process.platform !== 'win32'

[package]
name = "dshu-target-guard"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
  "Wdk_Foundation",
  "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization",
  "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Pipes",
  "Win32_System_Console", "Win32_System_Rpc", "Win32_System_SystemServices", "Win32_NetworkManagement_WindowsFilteringPlatform"
] }

[profile.release]
panic = "abort"
strip = true
lto = "thin"

[workspace]
